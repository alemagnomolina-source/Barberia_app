<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consultas - Barbería</title>
</head>

<body>

<div style="background:#0d0d0d;padding:15px;display:flex;gap:20px;align-items:center;">

    <span style="color:#00ff88;font-weight:bold;font-size:18px;">
        💈 BarberApp
    </span>

    <a href="/consultas" style="color:white;text-decoration:none;">Consultas</a>
    <a href="/agenda" style="color:white;text-decoration:none;">Agenda</a>
    <a href="/agenda_semana" style="color:white;text-decoration:none;">Semana</a>
    <a href="/estadisticas" style="color:white;text-decoration:none;">Estadísticas</a>
    <a href="/dashboard" style="color:white;text-decoration:none;">Dashboard</a>

</div>

<h1>Consultas recibidas</h1>
<h2 style="margin-top:20px;">📩 Nuevas consultas</h2>

{% if consultas %}
{% for consulta in consultas %}

<div style="box-shadow:0 2px 6px rgba(0,0,0,0.1); padding:12px; margin-bottom:12px; border-radius:8px;">

    <p><strong>Nombre:</strong> {{ consulta[1] }}</p>
    <p><strong>Teléfono:</strong> {{ consulta[2] }}</p>
    <p><strong>Servicio:</strong> {{ consulta[3] }}</p>
    <p><strong>Mensaje:</strong> {{ consulta[4] }}</p>

    <br>

    <a href="/asignar_turno/{{consulta[0]}}">
        <button style="background:#00c853;color:white;border:none;padding:6px 10px;border-radius:5px;">
            📅 Asignar turno
        </button>
    </a>

    <a target="_blank"
    href="https://wa.me/549{{consulta[2]}}?text=Hola%20{{consulta[1]}},%20recibimos%20tu%20consulta.%20Te%20confirmamos%20el%20turno%20en%20breve.">
        <button style="background:#25D366;color:white;border:none;padding:6px 10px;border-radius:5px;">
            WhatsApp cliente
        </button>
    </a>

</div>

{% endfor %}
{% endif %}

</body>
</html>
